name: Mobile CI

on:
  push:
    branches: [main]
    tags: ['v*', '!v*-build.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust:
    name: Rust checks
    uses: ./.github/workflows/rust.yml

  android:
    name: Android ARM64 · APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true
      - name: Test platform bootstrap
        run: python3 -m unittest discover -s tool/tests -v
      - name: Generate native platform projects
        run: python3 tool/bootstrap.py --platforms android
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Release APK
        run: flutter build apk --no-pub --release --target-platform android-arm64 --split-per-abi
      - name: Prepare Android download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/axiom-edge-android-arm64.apk
      - name: Store APK in workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiom-edge-android-arm64
          path: dist/axiom-edge-android-arm64.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS · unsigned build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Test platform bootstrap
        run: python3 -m unittest discover -s tool/tests -v
      - name: Generate native platform projects
        run: python3 tool/bootstrap.py --platforms ios
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Apply iOS deployment target to generated Swift package
        run: python3 tool/bootstrap.py --platforms ios --configure-only
      - name: Build without Apple signing
        run: flutter build ios --no-pub --release --no-codesign
      - name: Archive unsigned iOS app for developers
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app dist/axiom-edge-ios-unsigned.zip
      - name: Store unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: axiom-edge-ios-unsigned
          path: dist/axiom-edge-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish application downloads
    # All dependencies must succeed. PRs never receive publication permissions.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [android, ios, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch the APK built and tested in this run
        uses: actions/download-artifact@v4
        with:
          name: axiom-edge-android-arm64
          path: dist
      - name: Fetch the unsigned iOS archive from this run
        uses: actions/download-artifact@v4
        with:
          name: axiom-edge-ios-unsigned
          path: dist
      - name: Prepare verified downloads and direct links
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_REF: ${{ github.ref }}
        run: >-
          python3 tool/release.py prepare
          --repository "$RELEASE_REPOSITORY"
          --commit "$RELEASE_COMMIT"
          --run-id "$RELEASE_RUN_ID"
          --run-number "$RELEASE_RUN_NUMBER"
          --ref "$RELEASE_REF"
          --directory dist
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/release.py publish --directory dist

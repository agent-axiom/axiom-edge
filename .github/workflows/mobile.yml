name: Mobile CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Android ARM64 · APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true
      - name: Test platform bootstrap
        run: python3 -m unittest discover -s tool/tests -v
      - name: Generate native platform projects
        run: python3 tool/bootstrap.py --platforms android
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Release APK
        run: flutter build apk --no-pub --release --target-platform android-arm64 --split-per-abi
      - name: Store APK in workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiom-edge-android-arm64
          path: build/app/outputs/flutter-apk/*arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS · unsigned build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Test platform bootstrap
        run: python3 -m unittest discover -s tool/tests -v
      - name: Generate native platform projects
        run: python3 tool/bootstrap.py --platforms ios
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Apply iOS deployment target to generated Swift package
        run: python3 tool/bootstrap.py --platforms ios --configure-only
      - name: Build without Apple signing
        run: flutter build ios --no-pub --release --no-codesign

  release:
    name: Publish Android APK to GitHub Releases
    # Publication runs only for version tags, never for PRs or ordinary pushes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the APK built and tested in this run
        uses: actions/download-artifact@v4
        with:
          name: axiom-edge-android-arm64
          path: dist
      - name: Calculate SHA-256 checksum
        shell: bash
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
